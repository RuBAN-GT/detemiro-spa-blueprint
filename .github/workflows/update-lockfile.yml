name: Refresh blueprint dependencies
on:
  push:
    branches: [chore/update-blueprint-deps]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable
      - name: Update manifests from verified dependency set
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const rootPath = 'package.json';
          const appPath = 'apps/general/package.json';
          const root = JSON.parse(fs.readFileSync(rootPath, 'utf8'));
          const app = JSON.parse(fs.readFileSync(appPath, 'utf8'));
          Object.assign(root.resolutions, {'@types/react':'^19.3.0','@types/react-dom':'~19.3.0'});
          Object.assign(app.dependencies, {
            '@modern-js/bff-core':'^3.9.3','@modern-js/plugin-bff':'^3.9.3',
            '@modern-js/runtime':'^3.9.3','@modern-js/server-runtime':'^3.9.3',
            i18next:'^26.4.2',react:'^19.3.0','react-dom':'^19.3.0','react-i18next':'^17.0.15'
          });
          Object.assign(app.devDependencies, {
            '@modern-js/app-tools':'3.9.3','@modern-js/tsconfig':'3.9.3',
            '@types/node':'^22.15.0','@types/react':'^19.3.0','@types/react-dom':'~19.3.0',
            eslint:'^9.39.5','ts-node':'^10.9.2','tsconfig-paths':'^4.2.0'
          });
          fs.writeFileSync(rootPath,JSON.stringify(root,null,2)+'\n');
          fs.writeFileSync(appPath,JSON.stringify(app,null,2)+'\n');
          NODE
      - name: Install dependencies
        run: |
          if ! yarn install > /tmp/blueprint-install.log 2>&1; then
            printf '::error title=Yarn error codes::'
            grep -oE 'YN[0-9]{4}' /tmp/blueprint-install.log | sort -u | tr '\n' ',' || true
            printf '\n'
            exit 1
          fi
      - run: node ../../node_modules/.bin/modern deploy
        working-directory: apps/general
      - run: node ../../node_modules/typescript/bin/tsc --noEmit --project tsconfig.json
        working-directory: apps/general
      - run: node ../../node_modules/eslint/bin/eslint.js 'src/**/*.{ts,tsx}'
        working-directory: apps/general
      - name: Commit lockfile and manifests
        run: |
          git add package.json apps/general/package.json yarn.lock
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'chore: update SPA blueprint dependencies'
            git push origin HEAD:chore/update-blueprint-deps
          fi
